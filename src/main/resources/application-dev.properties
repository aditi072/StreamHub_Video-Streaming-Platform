# Local development: MySQL on this machine.
# The "streamhub" database is created automatically on first start.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/streamhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:streamhub}
spring.datasource.password=${DB_PASSWORD:streamhub}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dev-only fallback JWT secret (never used in prod)
streamhub.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
