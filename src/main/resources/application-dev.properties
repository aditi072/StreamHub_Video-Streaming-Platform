# Local development: file-based H2 database, nothing to install
spring.datasource.url=jdbc:h2:file:./data/streamhub-dev;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Dev-only fallback JWT secret (never used in prod)
streamhub.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
