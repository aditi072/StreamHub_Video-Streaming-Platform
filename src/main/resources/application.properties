spring.application.name=streamhub-app
server.port=${PORT:8080}

# "dev" (local MySQL) unless SPRING_PROFILES_ACTIVE says otherwise, e.g. "prod" on EC2
spring.profiles.default=dev

spring.jpa.open-in-view=false

# Video uploads
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:2GB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:2GB}

# Actuator: only expose health and info
management.endpoints.web.exposure.include=health,info

# Kafka (local default: broker on localhost:9092)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=streamhub-app
spring.kafka.consumer.auto-offset-reset=earliest

# Redis (local default: localhost:6379)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT: JWT_SECRET must be set (at least 32 characters). Only the dev and test profiles have a fallback.
streamhub.jwt.secret=${JWT_SECRET}
streamhub.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Where uploaded and encoded files go: "local" (disk) or "s3"
streamhub.storage.type=${STORAGE_TYPE:local}
streamhub.storage.local-dir=${STORAGE_DIR:./data/videos}
# AWS credentials come from the standard chain (aws configure / env vars / EC2 IAM role), never from this file
streamhub.storage.s3.bucket=${S3_BUCKET:}
streamhub.storage.s3.region=${AWS_REGION:ap-south-1}
